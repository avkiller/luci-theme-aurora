name: luci-theme-aurora Release by fireworld

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Query workflow runs via API
        run: |

          CORE_FILE="build-theme-package-avkiller.yml"
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$CORE_FILE/runs?status=success&per_page=1")
          core_run_id=$(echo "$RESPONSE" | jq -r '.workflow_runs[].id')
          echo "Core Previous successful run IDs: $core_run_id"
          echo "CORE_ID=$core_run_id" >> $GITHUB_ENV

      - name: Download Core Artifact ipk
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ env.CORE_ID }}
          repo: avkiller/luci-theme-aurora
          name: luci-theme-aurora-master-ipk
          path: ipk

      - name: Download Core Artifact apk
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ env.CORE_ID }}
          repo: avkiller/luci-theme-aurora
          name: luci-theme-aurora-master-apk
          path: apk

      - name: Index and sign IPK and APK feeds
        shell: bash
        env:
          USIGN_KEY: ${{ secrets.USIGN_KEY }}
          APK_KEY: ${{ secrets.APK_KEY }}
          APK_PUB_KEY: ${{ secrets.APK_PUB_KEY }}
        run: |
          set -euo pipefail

          WORK_DIR="$(pwd)"
          IPK_DIR="$WORK_DIR/ipk"
          APK_DIR="$WORK_DIR/apk"

          SHIM_DIR="$(mktemp -d)"
          KEY_DIR="$(mktemp -d)"
          trap 'rm -rf "$SHIM_DIR" "$KEY_DIR"' EXIT

          cat <<'EOF' > "$SHIM_DIR/sha256"
          #!/usr/bin/env sh
          [ "$1" = "sha256" ] && shift
          sha256sum "$@" | awk '{print $1}'
          EOF
          chmod +x "$SHIM_DIR/sha256"

          USIGN_KEY_FILE="$KEY_DIR/usign.key"
          APK_KEY_FILE="$KEY_DIR/apk.key"
          [ -n "${USIGN_KEY:-}" ] && printf '%s\n' "$USIGN_KEY" > "$USIGN_KEY_FILE"
          [ -n "${APK_KEY:-}" ] && printf '%s\n' "$APK_KEY" > "$APK_KEY_FILE"

          # 1. IPK：使用 ipk/.tools
          if [ -d "$IPK_DIR" ] && compgen -G "$IPK_DIR/*.ipk" > /dev/null; then
            (
              cd "$IPK_DIR"
              [ -d ".tools" ] && chmod +x .tools/* 2>/dev/null || true
              IPK_PATH="$SHIM_DIR:$(pwd)/.tools:$PATH"

              PATH="$IPK_PATH" .tools/ipkg-make-index.sh . > Packages
              gzip -9c Packages > Packages.gz

              if [ -s "$USIGN_KEY_FILE" ]; then
                PATH="$IPK_PATH" usign -S -m Packages -s "$USIGN_KEY_FILE" -x Packages.sig
              fi
            )
          fi

          # 2. APK：一步生成并签名索引，随后校验
          if [ -d "$APK_DIR" ] && compgen -G "$APK_DIR/*.apk" > /dev/null; then
            APK="$APK_DIR/.tools/apk"
            chmod +x "$APK" 2>/dev/null || true


            # 2.1 私钥归一化为 SEC1（兼容 PKCS#8）
            SIGN_KEY_FILE=""
            if [ -s "$APK_KEY_FILE" ]; then
              SIGN_KEY_FILE="$APK_KEY_FILE"
              case "$(head -n1 "$SIGN_KEY_FILE")" in
                *"BEGIN EC PRIVATE KEY"*) : ;;
                *"BEGIN PRIVATE KEY"*)
                  openssl ec -in "$SIGN_KEY_FILE" -out "$KEY_DIR/apk.sec1.pem"
                  SIGN_KEY_FILE="$KEY_DIR/apk.sec1.pem" ;;
                *) echo "::error::APK_KEY 不是 EC 私钥: $(head -n1 "$SIGN_KEY_FILE")"
                   exit 1 ;;
              esac
            fi

            # 2.2 公钥落到 keys-dir（优先用 APK_PUB_KEY，否则从私钥导出）
            APK_KEYS_DIR="$KEY_DIR/apk-keys"
            mkdir -p "$APK_KEYS_DIR"
            if [ -n "${APK_PUB_KEY:-}" ]; then
              printf '%s\n' "$APK_PUB_KEY" > "$APK_KEYS_DIR/homeproxy-custom.pem"
            elif [ -n "$SIGN_KEY_FILE" ]; then
              openssl pkey -in "$SIGN_KEY_FILE" -pubout \
                -out "$APK_KEYS_DIR/homeproxy-custom.pem"
            fi

            # 2.3 生成索引；有密钥则同一步签名
            (
              cd "$APK_DIR"
              if [ -n "$SIGN_KEY_FILE" ]; then
                "$APK" mkndx --allow-untrusted \
                  --keys-dir "$APK_KEYS_DIR" \
                  --sign "$SIGN_KEY_FILE" \
                  -o packages.adb ./*.apk
              else
                "$APK" mkndx --allow-untrusted -o packages.adb ./*.apk
              fi
            )

            # 2.4 校验：SIG 块 + 验签
            if [ -n "$SIGN_KEY_FILE" ]; then
              echo "--- adbdump sig ---"
              "$APK" adbdump "$APK_DIR/packages.adb" \
                | grep -i -A3 'sig' || echo "::warning::未见 SIG 块"

              echo "--- verify ---"
              if "$APK" --keys-dir "$APK_KEYS_DIR" verify "$APK_DIR/packages.adb"; then
                echo "::notice::packages.adb 签名校验通过"
              else
                echo "::error::packages.adb 验签失败"
                exit 1
              fi
            fi
          fi


      - name: Prepare Assets for  Release
        env:
          PKG_NAME: luci-theme-aurora
          PAGE_TITLE: luci-theme-aurora Feed
          LIST_HEADING: "📦 Aurora's Feed & 包下载列表"
          ARCH_DIRS: "apk ipk"
        run: |
          set -e
          mkdir -p dist/

          # 1. 拷贝各架构目录
          for arch in $ARCH_DIRS; do
            if [ -d "$arch" ] && [ -n "$(ls -A "$arch" 2>/dev/null)" ]; then
              cp -r "$arch" dist/
              echo "✅ 已拷贝 $arch/ 到 dist/"
            else
              echo "⚠️ $arch/ 目录不存在或为空，跳过"
            fi
          done

          echo "📂 dist/ 目录结构:"
          ls -la dist/

          # 2. 定义别名复制辅助函数（找到匹配文件才复制，避免报错中断）
          copy_alias() {
            local pattern="$1"
            local dest="$2"
            local desc="$3"
            local matched
            matched=$(ls $pattern 2>/dev/null | head -n1 || true)

            if [ -n "$matched" ]; then
              cp -v "$matched" "$dest"
            else
              echo "⚠️ 未找到 ${desc} (${pattern})，跳过创建副本"
            fi
          }

          # 按需调整 实际生成的包名规则
          copy_alias "dist/ipk/${PKG_NAME}[_-]*.ipk" "dist/${PKG_NAME}_all.ipk" "ipk包"
          copy_alias "dist/apk/${PKG_NAME}[_-]*.apk" "dist/${PKG_NAME}_all.apk" "apk包"

          # 3. 生成 index.html
          cat <<EOF > dist/index.html
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <title>${PAGE_TITLE}</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 40px; background: #f4f5f7; color: #333; }
              h1 { margin-bottom: 24px; }
              .section { background: #fff; margin-bottom: 20px; padding: 16px 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
              .section-title { font-weight: bold; font-size: 16px; margin-bottom: 12px; }
              ul { list-style: none; padding: 0; margin: 0; }
              li { padding: 8px 0; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; gap: 16px; }
              li:last-child { border-bottom: none; }
              a { color: #2f80ed; text-decoration: none; font-weight: 600; font-family: monospace; word-break: break-all; }
              a:hover { text-decoration: underline; }
              .time { color: #777; font-size: 13px; font-family: monospace; white-space: nowrap; }
            </style>
          </head>
          <body>
            <h1>${LIST_HEADING}</h1>
          EOF
          echo " 进入dist目录开始操作"
          cd dist || exit 1
          while IFS= read -r dir; do
            rel_dir="${dir#./}"
            if [ "$rel_dir" = "." ] || [ -z "$rel_dir" ]; then
              section_title="📂 根目录"
            else
              section_title="📂 $rel_dir"
            fi

            {
              echo "  <div class=\"section\">"
              echo "    <div class=\"section-title\">${section_title}</div>"
              echo "    <ul>"
            } >> index.html

            while IFS= read -r file; do
              [ -n "$file" ] || continue
              filename=$(basename "$file")
              mtime=$(date -r "$file" '+%Y.%m.%d %H:%M:%S' 2>/dev/null || date '+%Y.%m.%d %H:%M:%S')
              # rel_path="${file#.}"
              rel_path="${file#./}"

              echo "      <li><a href=\"./${rel_path}\">${filename}</a> <span class=\"time\">[${mtime}]</span></li>" >> index.html
            # done < <(find "$dir" -maxdepth 1 -type f ! -name "index.html" | sort)
            done < <(find "$dir" -maxdepth 1 -type f -path "*/.tools/*" -prune -o ! -name "index.html" -print | sort)


            {
              echo "    </ul>"
              echo "  </div>"
            } >> index.html

          done < <(find . -type f -path "*/.tools/*" -prune -o ! -name "index.html" -printf "%h\n" | sort -u)
          # done < <(find . -type f ! -name "index.html" -printf "%h\n" | sort -u)

          echo "</body></html>" >> index.html
          echo "✅ index.html 生成完成"
          echo "最终生成的目录"
          # 显示index文件
          cat index.html
          # 显示最终目录
          echo "最终生成的目录"
          ls -la .
      - name: Deploy to Cloudflare Pages
        if: false
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=aurora
